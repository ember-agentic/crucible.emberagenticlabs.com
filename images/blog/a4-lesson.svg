<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a4-ember" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D95B43"/></marker>
    <marker id="a4-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a9d5b"/></marker>
  </defs>

  <rect width="880" height="452" fill="#ffffff"/>

  <!-- ===================== TRACK 1 - LLM alone ===================== -->
  <rect x="22" y="16" width="836" height="196" rx="12" fill="#fffdfc" stroke="#D95B43" stroke-width="1.8"/>
  <rect x="22" y="16" width="836" height="46" rx="12" fill="#fdecea"/>
  <rect x="22" y="46" width="836" height="16" fill="#fdecea"/>
  <line x1="22" y1="62" x2="858" y2="62" stroke="#f0cfc6" stroke-width="1"/>
  <text x="46" y="45" fill="#b23a26" font-size="15" font-weight="700">LLM alone <tspan font-weight="400" fill="#a9756a">&#8212; the lesson evaporates</tspan></text>

  <rect x="46" y="106" width="150" height="52" rx="9" fill="#ffffff" stroke="#D95B43" stroke-width="1.8"/>
  <text x="121" y="128" fill="#b23a26" font-size="13" font-weight="600" text-anchor="middle">You correct</text>
  <text x="121" y="145" fill="#b23a26" font-size="13" font-weight="600" text-anchor="middle">the model</text>

  <line x1="196" y1="132" x2="262" y2="132" stroke="#D95B43" stroke-width="2.4" marker-end="url(#a4-ember)"/>

  <rect x="264" y="106" width="150" height="52" rx="9" fill="#ffffff" stroke="#D95B43" stroke-width="1.8"/>
  <text x="339" y="137" fill="#b23a26" font-size="13" text-anchor="middle">session ends</text>

  <line x1="414" y1="132" x2="480" y2="132" stroke="#D95B43" stroke-width="2.4" marker-end="url(#a4-ember)"/>

  <rect x="482" y="106" width="150" height="52" rx="9" fill="#fdecea" stroke="#D95B43" stroke-width="1.8"/>
  <text x="557" y="137" fill="#b23a26" font-size="13" font-weight="700" text-anchor="middle">lesson gone</text>

  <path d="M557,158 C557,192 300,192 121,186 L121,162" fill="none" stroke="#D95B43" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a4-ember)"/>
  <text x="392" y="201" fill="#b23a26" font-size="12" font-style="italic" text-anchor="middle">re-teach it tomorrow &#8212; every session, forever</text>

  <!-- ===================== TRACK 2 - With Crucible ===================== -->
  <rect x="22" y="240" width="836" height="196" rx="12" fill="#fcfffc" stroke="#3a9d5b" stroke-width="1.8"/>
  <rect x="22" y="240" width="836" height="46" rx="12" fill="#eef9f0"/>
  <rect x="22" y="270" width="836" height="16" fill="#eef9f0"/>
  <line x1="22" y1="286" x2="858" y2="286" stroke="#cde8d4" stroke-width="1"/>
  <text x="46" y="269" fill="#2f7d49" font-size="15" font-weight="700">With Crucible <tspan font-weight="400" fill="#6fa37e">&#8212; the lesson sticks</tspan></text>

  <rect x="46" y="330" width="150" height="52" rx="9" fill="#ffffff" stroke="#3a9d5b" stroke-width="1.8"/>
  <text x="121" y="352" fill="#2f7d49" font-size="13" font-weight="600" text-anchor="middle">You correct</text>
  <text x="121" y="369" fill="#2f7d49" font-size="13" font-weight="600" text-anchor="middle">the model</text>

  <line x1="196" y1="356" x2="240" y2="356" stroke="#3a9d5b" stroke-width="2.4" marker-end="url(#a4-green)"/>

  <rect x="242" y="330" width="172" height="52" rx="9" fill="#ffffff" stroke="#3a9d5b" stroke-width="1.8"/>
  <text x="328" y="352" fill="#2f7d49" font-size="12.5" text-anchor="middle">encode it once as an</text>
  <text x="328" y="368" fill="#2f7d49" font-size="12.5" text-anchor="middle">acceptance criterion</text>

  <line x1="414" y1="356" x2="458" y2="356" stroke="#3a9d5b" stroke-width="2.4" marker-end="url(#a4-green)"/>

  <rect x="460" y="330" width="180" height="52" rx="9" fill="#ffffff" stroke="#3a9d5b" stroke-width="1.8"/>
  <text x="550" y="352" fill="#2f7d49" font-size="12.5" text-anchor="middle">the gate applies it on</text>
  <text x="550" y="368" fill="#2f7d49" font-size="12.5" text-anchor="middle">every relevant task</text>

  <line x1="640" y1="356" x2="684" y2="356" stroke="#3a9d5b" stroke-width="2.4" marker-end="url(#a4-green)"/>

  <rect x="686" y="328" width="156" height="56" rx="28" fill="#eef9f0" stroke="#3a9d5b" stroke-width="2"/>
  <text x="764" y="351" fill="#2f7d49" font-size="12" font-weight="700" text-anchor="middle">enforced from now on</text>
  <text x="764" y="367" fill="#2f7d49" font-size="9.5" text-anchor="middle">whether or not you're in the room</text>

  <text x="440" y="416" fill="#2f7d49" font-size="12" font-style="italic" text-anchor="middle">teach it once &#8212; the record and the gate carry it forward</text>
</svg>
